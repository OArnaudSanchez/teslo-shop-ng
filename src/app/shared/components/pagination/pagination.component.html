<div class="join flex justify-center items-center my-auto">
  @for(page of getPages(); track page){
    <button 
      class="join-item btn" 
      [class.btn-primary]="page === activePage()"
      [routerLink]="[]"
      [queryParams]="{ page: page }"
      (click)="activePage.set(page)">
      {{ page }}
    </button>
  }
</div>
