<h1 class="text-2xl font-bold">Listado de productos</h1>
<h3 class="text-lg">
    Total de productos
    <span class="text-accent">{{ productCount }}</span>
</h3>

<div class="divider"></div>

<div class="flex gap-2 items-center h-20">
    <app-pagination [currentPage]="currentPage()" [pages]="productsResource.value()?.pages ?? 0"/>
    
    <select class="select select-bordered w-32" [(ngModel)]="productsPerPage">
        @for(optionValue of productsPerPageOptions; track optionValue){
            
            <option [value]="optionValue">{{ optionValue }}</option>
        }
    </select>

    <div class="flex flex-1"></div>

    <a routerLink="/admin/product/new" class="btn btn-primary">Nuevo producto</a>
</div>
<product-table [products]="productsResource.value()?.products ?? []" />
